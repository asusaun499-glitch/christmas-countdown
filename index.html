<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="นับถอยหลังสู่วันเปิดแมพ 25 ธันวาคม 2569">
  <title>Countdown to Christmas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="countdown-screen">
    <div class="countdown-content">
      <p class="message">แมพ Maria Town จะเปิดในอีก</p>
      <div class="countdown" role="timer" aria-label="เวลาที่เหลือก่อนเปิดแมพ">
      <div class="unit"><span class="value" id="days">000</span><span class="label">วัน</span></div>
      <span class="separator">:</span>
      <div class="unit"><span class="value" id="hours">00</span><span class="label">ชั่วโมง</span></div>
      <span class="separator">:</span>
      <div class="unit"><span class="value" id="minutes">00</span><span class="label">นาที</span></div>
      <span class="separator">:</span>
      <div class="unit"><span class="value" id="seconds">00</span><span class="label">วินาที</span></div>
      </div>
    </div>
  </main>
  <section class="celebration" id="celebration" aria-hidden="true">
    <div>เปิดแมพแล้ว! 🎄</div>
  </section>
  <audio id="christmasSong" src="assets/jingle-bell-rock.mp3" preload="none"></audio>
  <script>
    window.CHRISTMAS_CONFIG = {
      targetMs: new Date('2026-12-25T00:00:00+07:00').getTime(),
      serverNowMs: Date.now(),
      timezone: 'Asia/Bangkok'
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
